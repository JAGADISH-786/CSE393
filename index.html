<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.popup{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0b5ed7;
}
</style>
</head>

<body>

<div class="popup">
    <h3>Course Certificate</h3>
    <button onclick="openCertificate()">
        View Certificate
    </button>
</div>

<script>
function openCertificate() {
    window.location.href = "photo.png.jpg";
}
</script>

</body>
</html>
